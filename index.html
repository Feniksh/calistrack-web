<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalisTrack Web - App de Treino</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 12px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 30px;
        }
        .exercise-container {
            margin-bottom: 30px;
        }
        .exercise-card {
            background: #2d3436;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: transform 0.3s ease;
        }
        .exercise-card:hover {
            transform: scale(1.05);
        }
        .exercise-title {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .button {
            background: #00b894;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        .button:hover {
            background: #00cec9;
        }
        .timer {
            font-size: 2rem;
            margin: 20px 0;
            padding: 15px;
            background: #2d3436;
            border-radius: 10px;
            width: 200px;
            margin: 0 auto;
        }
        .timer-controls button {
            font-size: 1.5rem;
            padding: 10px 20px;
            margin: 10px;
            background: #e74c3c;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
        }
        .timer-controls button:hover {
            background: #d63031;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CalisTrack Web - Controle de Exercícios</h1>

        <div class="exercise-container">
            <div class="exercise-card">
                <div class="exercise-title">Flexão</div>
                <p>Faça 3 séries de 15 repetições</p>
                <button class="button">Iniciar Exercício</button>
            </div>
            <div class="exercise-card">
                <div class="exercise-title">Abdominal</div>
                <p>Faça 3 séries de 20 repetições</p>
                <button class="button">Iniciar Exercício</button>
            </div>
            <div class="exercise-card">
                <div class="exercise-title">Agachamento</div>
                <p>Faça 3 séries de 20 repetições</p>
                <button class="button">Iniciar Exercício</button>
            </div>
        </div>

        <div class="timer">
            <p>Restando:</p>
            <span id="time">00:00</span>
        </div>

        <div class="timer-controls">
            <button id="startTimer">Iniciar</button>
            <button id="stopTimer">Parar</button>
        </div>
    </div>

    <script>
        let timer;
        let seconds = 0;
        let minutes = 0;
        let isRunning = false;

        // Função para formatar o tempo
        function formatTime() {
            return (minutes < 10 ? '0' : '') + minutes + ':' + (seconds < 10 ? '0' : '') + seconds;
        }

        // Função para iniciar o cronômetro
        document.getElementById('startTimer').addEventListener('click', function() {
            if (!isRunning) {
                isRunning = true;
                timer = setInterval(function() {
                    seconds++;
                    if (seconds === 60) {
                        seconds = 0;
                        minutes++;
                    }
                    document.getElementById('time').textContent = formatTime();
                }, 1000);
            }
        });

        // Função para parar o cronômetro
        document.getElementById('stopTimer').addEventListener('click', function() {
            clearInterval(timer);
            isRunning = false;
        });
    </script>
</body>
</html>
